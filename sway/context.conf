# sway-context: named work contexts spanning all non-ambient outputs.
# Symlinked from ~/src/sway-context-manager/sway/context.conf
bindsym $mod+x exec ~/bin/sway-context switch          # pick a context, or type a new name
bindsym $mod+Shift+x exec ~/bin/sway-context close     # forget the current context (windows stay)
bindsym $mod+Control+x exec ~/bin/sway-context name    # name/rename the current slot as a context
bindsym $mod+Tab exec ~/bin/sway-context next          # cycle through contexts
bindsym $mod+Shift+Tab exec ~/bin/sway-context prev
bindsym $mod+y exec ~/bin/sway-context run                 # menu of actions for the current context
bindsym $mod+Shift+Return exec ~/bin/sway-context run terminal
